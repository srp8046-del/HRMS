<div id="loginView" class="auth-shell"><div class="auth-card"><div class="brand-mark">LI</div><div class="eyebrow">LEEWAY INTERNATIONAL</div><h1>HRMS</h1><p class="muted">Human Resource Management System</p><form id="loginForm" autocomplete="on"><label>Username<input id="username" name="username" autocomplete="username" placeholder="Enter username" required></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required></label><button id="loginBtn" type="submit">Sign in</button><div id="loginError" class="error" role="alert"></div></form><div class="auth-footer">Secure workforce access</div></div></div>
