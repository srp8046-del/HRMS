<style>
.date-filter{padding:0 24px}.date-filter-inner{display:flex;align-items:end;gap:12px;padding:12px 14px;margin:0 0 4px;border:1px solid rgba(128,128,128,.22);border-radius:12px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.05);flex-wrap:wrap}.date-filter-label{font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.7}.date-filter-inner label{font-size:11px;font-weight:700;display:flex;flex-direction:column;gap:5px}.date-filter-inner input{height:36px;padding:0 10px;border:1px solid rgba(128,128,128,.35);border-radius:8px;background:transparent;color:inherit}.date-filter-inner button{height:36px;padding:0 14px;cursor:pointer}.ghost{border:1px solid #dce2ea;background:#fff;color:#3b2a12;padding:10px 14px;border-radius:10px;font-weight:750;cursor:pointer}.upload-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.upload-card{display:flex;flex-direction:column;gap:10px}.upload-card input[type=file]{width:100%;padding:10px;border:1px dashed #d6b86a;border-radius:10px;background:#fffdf8}.file-name{font-size:12px;color:#687384;min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upload-error{margin-top:18px;padding:14px;border:1px solid #ffd3d6;border-radius:12px;background:#fff4f4;color:#8b1e27}.attendance-scroll,.detailed-scroll,.master-scroll{overflow:auto;max-width:100%;max-height:calc(100vh - 245px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y}.attendance-table,.detailed-table{width:max-content;min-width:100%}.attendance-table th,.attendance-table td,.detailed-table th,.detailed-table td{min-width:58px}.attendance-table th:nth-child(-n+9),.attendance-table td:nth-child(-n+9),.detailed-table th:nth-child(-n+9),.detailed-table td:nth-child(-n+9){min-width:130px}.attendance-table thead th,.detailed-table thead th,.master-table thead th{position:sticky;top:0;z-index:3}.attendance-table thead th{background:#f7f8fa}.detailed-table th{white-space:nowrap}.detailed-table thead th{text-
